app = 'fly-crypto-oi-strategy'
primary_region = 'ams'

[build]

[processes]
  app = "uvicorn backend.main:app --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  SYMBOLS = "BTCUSDT,ETHUSDT"
  TP_PCT = "1.5"
  SL_PCT = "0.8"
  MIN_CONFIDENCE = "45"
  POSITION_SIZE_USD = "100"
  SIGNAL_INTERVAL = "5"
  DB_PATH = "/data/trading.db"

[[vm]]
  memory = '512mb'
  cpus = 1